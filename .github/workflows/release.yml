name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        run: sed -i "s/const VERSION = \"[^\"]*\"/const VERSION = \"${GITHUB_REF_NAME#v}\"/" dist/ha-appliance-cards.js
      - name: Upload card to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ha-appliance-cards.js --clobber
